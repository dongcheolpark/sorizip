plugins {
    id 'java'
    id 'war'
    id 'com.diffplug.spotless' version '6.25.0'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    // 이 두 줄이 핵심입니다 (톰캣을 라이브러리로 가져옴)
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.19'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:10.1.19'

    // DB 및 기타 의존성
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

task appRun(type: JavaExec) {
    group = 'application' // ./gradlew tasks 했을 때 보여질 그룹
    description = '임베디드 톰캣 서버를 실행합니다.'

    // 컴파일된 클래스와 라이브러리들을 모두 로드합니다.
    classpath = sourceSets.main.runtimeClasspath

    // 실행할 메인 클래스 (아까 성공하신 그 파일 경로)
    mainClass = 'com.example.web.TomcatServer'

    // (선택) 한글 깨짐 방지 등 JVM 옵션이 필요하면 추가
    jvmArgs = ['-Dfile.encoding=UTF-8']
}